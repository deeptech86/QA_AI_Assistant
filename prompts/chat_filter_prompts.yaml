# User input validation prompts
input_validation:
  insufficient_detail: "Please provide a more detailed question."
  topic_restriction: "I can only help with programming or data science. {reason}"
  input_approved: "Input approved"

# Response messages for different scenarios
response_messages:
  rejection_base: "🚫 {filter_message}\n\nPlease ask me about:\n- Programming and software development\n- Data science and analytics"
  
  forbidden_topic_response: "I apologize, but I cannot provide information on that topic. Please ask me about programming or data science instead."
  
  api_error: "API Error: {error}"
  
  unexpected_error: "Unexpected error: {error}"
  
  processing_failed: "Failed to get response from Claude"

# UI Text and Labels
ui_text:
  page_title: "Restricted Claude Chat"
  page_icon: "🔒"
  
  sidebar:
    title: "🔒 QA Assistant_5"
    allowed_topics_header: "### Allowed GH Topics:"
    forbidden_topics_header: "### Forbidden Topics:"
    
  main_title: "🔒 QA Agent Assistant_5"
  main_description: "**This AI assistant only answers questions about Programming, Data Science, and Business topics.**"
  
  examples:
    header: "### 💡 Example Questions You Can Ask:"
    good_examples: |
      **✅ Good Examples:**
      - "How do I optimize this Python function?"
      - "Explain machine learning model evaluation"
      - "What's a good marketing strategy for SaaS?"
      - "Help me debug this SQL query"
    
    bad_examples: |
      **❌ Will Be Rejected:**
      - "What should I do about my health issue?"
      - "Give me legal advice about contracts"
      - "What do you think about current politics?"
      - "Help me with personal relationship problems"

# Configuration for topic filtering
topic_configuration:
  allowed_topics:
    programming: 
      - "code"
      - "programming" 
      - "python"
      - "javascript"
      - "software"
      - "debugging"
      - "algorithm"
      - "quality Assurance"
      - "testing"
      - "test cases"
      - "automation"
      - "unit tests"
      - "integration tests"
      - "test automation"
    
    data_science: 
      - "data"
      - "analysis"
      - "statistics"
      - "machine learning"
      - "pandas"
      - "numpy"
      - "visualization"

    file_system:
      - "files"
      - "create"
      - "filesystem"
      - "write"
      - "read"
      - "folders"
      - "directory"
  forbidden_topics:
    - "medical advice"
    - "legal advice"
    - "personal information"
    - "harmful content"
    - "violence"
    - "illegal activities"
    - "personal relationships"
    - "politics"

# Regular expressions for code detection
code_patterns:
  - '\\bdef\\s+\\w+\\('
  - '\\bclass\\s+\\w+'
  - '\\bimport\\s+\\w+'
  - '\\bfunction\\s+\\w+'
  - '[{}();]'
  - '\\b(if|else|for|while)\\b'

# Filter reasons and messages
filter_messages:
  forbidden_topic: "Contains forbidden topic: {topic}"
  allowed_topics_found: "Allowed topics found: {topics}"
  code_content_detected: "Contains code-like content"
  no_topics_detected: "No allowed topics detected"

# Action options for the main interface
action_options:
  - "Test Case generation"
  - "Generate Unit Test in Java"
  - "Generate Selenium Code"
  - "Generate Playwright Code"
  - "Generate TestComplete Code"
  - "Generate API Test Code"
  - "Convert Existing Code"

# Language options for different tools
language_options:
  selenium_languages:
    - "Java"
    - "Python"
    - "JavaScript"
    - "C#"
  
  testcomplete_languages:
    - "Java"
    - "Python"
    - "JavaScript"
    - "C#"
  
  api_test_languages:
    - "Java"
    - "Python"
    - "JavaScript"
  
  conversion_options:
    - "Java Selenium to Playwright Javascript"
    - "Python Selenium to Playwright Javascript"
    - "JavaScript Playwright to Cypress JavaScript"
